filters:
  - id: sort
    name: Sort
    type: select
    options:
      - name: "Best match"
        value: "relevance:desc"
      - name: "Latest update"
        value: "chapter_updated_at:desc"
      - name: "Recently added"
        value: "created_at:desc"
      - name: "Title (A-Z)"
        value: "title:asc"
      - name: "Title (Z-A)"
        value: "title:desc"
      - name: "Year (newest)"
        value: "year:desc"
      - name: "Year (oldest)"
        value: "year:asc"
      - name: "Highest rated"
        value: "score:desc"
      - name: "Most viewed - 7 days"
        value: "views_7d:desc"
      - name: "Most viewed - 30 days"
        value: "views_30d:desc"
      - name: "Most viewed - all time"
        value: "views_total:desc"
      - name: "Most followed"
        value: "follows_total:desc"
    default:
      name: "Best match"
      value: "relevance:desc"

  - id: content_rating
    name: Content rating
    type: select
    options:
      - name: "Safe only"
        value: "safe"
      - name: "Up to suggestive"
        value: "safe,suggestive"
      - name: "Up to erotica"
        value: "safe,suggestive,erotica"
        nsfw: true
      - name: "Everything"
        value: "safe,suggestive,erotica,pornographic"
        nsfw: true
    default:
      name: "Up to suggestive"
      value: "safe,suggestive"

  - id: types
    name: Type
    type: multiselect
    options_ref: types

  - id: statuses
    name: Status
    type: multiselect
    options_ref: statuses

  - id: demographics
    name: Demographic
    type: multiselect
    options_ref: demographics

  - id: genres_include
    name: Genres include
    type: multiselect
    options_ref: genres

  - id: genres_exclude
    name: Genres exclude
    type: multiselect
    options_ref: genres

  - id: formats_include
    name: Formats include
    type: multiselect
    options_ref: formats

  - id: formats_exclude
    name: Formats exclude
    type: multiselect
    options_ref: formats

  - id: genres_mode
    name: Match genres and formats
    type: select
    options:
      - name: "All of them (AND)"
        value: "and"
      - name: "Any of them (OR)"
        value: "or"
    default:
      name: "All of them (AND)"
      value: "and"

  - id: min_chapters
    name: Minimum chapters
    type: text_input

  - id: year_range
    name: Release year
    type: int_range
    min: 1928
    max: 2027

preferences:
  - key: cover_size
    label: "Cover size"
    kind: select
    options:
      - name: "Medium"
        value: "medium"
      - name: "Large"
        value: "large"
    default: "large"
    description: "Which of the source's two cover renditions to request."

  - key: alt_titles_in_description
    label: "Show alternative names in the description"
    kind: toggle
    default: "false"

  - key: extra_info_in_description
    label: "Show year, rating, and follower count in the description"
    kind: toggle
    default: "true"

  - key: tags_in_genres
    label: "Show narrative tags alongside genres"
    kind: toggle
    default: "false"
    description: >-
      The site keeps a long list of narrative tags (Time Travel, Vampires, …)
      separately from its genres and does not show them on the title page.
