[workspace]
resolver = "3"
members = [
    "kani-cubari",
    "kani-mangadex",
    "kani-mangapill",
    "kani-mangapill-gen",
    "kani-weebcentral",
]

# These profiles are not optional decoration: `kani-cli build` compiles
# extensions with `--profile wasm-release` (or `wasm-debug` for `--debug`), so a
# workspace without them cannot build an extension at all. They are copied from
# the server workspace and should stay in step with it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Preserves function names for readable WASM backtraces.
# Use with: kani-cli build --debug <extension>
[profile.wasm-debug]
inherits = "wasm-release"
opt-level = 1
lto = "thin"
debug = true
strip = "none"
debug-assertions = true

[workspace.lints.clippy]
unwrap_used = { level = "deny", priority = 1 }

# The git dependency above resolves — the server repository is public — but it
# tracks `develop`, which still carries kani-shared v0.1.0, an ABI predating
# `ChapterInfo::page_count`. Building against it fails to compile. This override
# points at the sibling checkout until the road-to-1.0 branch lands on develop,
# at which point the patch can simply be deleted.
#
# It lives in the workspace manifest rather than .cargo/config.toml because cargo
# discovers config from the *current directory*, and kani-cli invokes cargo from
# the server checkout with --manifest-path pointing here; a config file in this
# directory would never be read. A [patch] in the workspace manifest always is.
#
# Stage 4 publishes kani-shared, replacing the git dependency with a version one
# and removing the need for either this or a sibling checkout.
[patch."https://github.com/ArloB/kani"]
kani-shared = { path = "../kani/kani-shared" }
