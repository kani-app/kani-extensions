[workspace]
resolver = "3"
members = [
    "kani-comix",
    "kani-cubari",
    "kani-mangadex",
    "kani-mangapill",
    "kani-mangapill-gen",
    "kani-weebcentral",
]

# These profiles are not optional decoration: `kani-cli build` compiles
# extensions with `--profile wasm-release` (or `wasm-debug` for `--debug`), so a
# workspace without them cannot build an extension at all. They are copied from
# the server workspace and should stay in step with it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Preserves function names for readable WASM backtraces.
# Use with: kani-cli build --debug <extension>
[profile.wasm-debug]
inherits = "wasm-release"
opt-level = 1
lto = "thin"
debug = true
strip = "none"
debug-assertions = true

[workspace.lints.clippy]
unwrap_used = { level = "deny", priority = 1 }

# Until `kani-shared` is published, the git dependency each crate declares cannot
# resolve: the server repository is private, so cargo has no credentials for it.
# This override points those crates at the sibling checkout instead — the same
# two-checkouts-side-by-side arrangement kani-cli's --ext-dir resolution assumes.
#
# It goes here rather than in .cargo/config.toml because cargo discovers config
# from the *current directory*, and kani-cli invokes cargo from the server
# checkout with --manifest-path pointing here; a config file in this directory
# would never be read. A [patch] in the workspace manifest always is.
#
# Stage 4 removes both this and the git dependency in favour of a plain version
# dependency, at which point this repository builds standalone — which is what a
# third-party extension author needs.
[patch."https://github.com/ArloB/kani"]
kani-shared = { path = "../kani/kani-shared" }
